name: Build Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: |
          uv run pyinstaller \
            --name spark \
            --onefile \
            --console \
            --add-data "src/spark:spark" \
            main.py

      - name: Test binary
        run: ./dist/spark --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-linux
          path: dist/spark

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: |
          uv run pyinstaller \
            --name spark \
            --onefile \
            --console \
            --add-data "src/spark:spark" \
            main.py

      - name: Test binary
        run: ./dist/spark --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-macos
          path: dist/spark

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: |
          uv run pyinstaller `
            --name spark `
            --onefile `
            --console `
            --add-data "src/spark;spark" `
            main.py

      - name: Test binary
        run: ./dist/spark.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-windows
          path: dist/spark.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            binaries/spark-linux/spark
            binaries/spark-macos/spark
            binaries/spark-windows/spark.exe
          generate_release_notes: true