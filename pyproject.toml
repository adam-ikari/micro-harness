[project]
name = "zero-agent"
version = "0.1.0"
description = "A minimal CLI agent with MCP, Skills, and security control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "textual>=0.50.0",
]

[project.scripts]
zero-agent = "zero_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
